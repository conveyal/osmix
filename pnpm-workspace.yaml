packages:
  - apps/*
  - packages/*

autoInstallPeers: true
enableGlobalVirtualStore: true
minimumReleaseAge: 0

tasks:
  build:
    dependsOn: ["^build"]
    outputs: ["dist/**"]
    inputs: ["src/**", "tsconfig*.json", "package.json"]
  "check:deps":
    outputs: []
    inputs: ["+**/package.json", "pnpm-workspace.yaml"]
  "check:docs":
    outputs: []
    inputs:
      [
        "README.md",
        "docs/merge-process.md",
        "packages/change/README.md",
        "packages/vt/README.md",
        "packages/gtfs/README.md",
        "packages/router/README.md",
        "packages/load/README.md",
        "packages/core/README.md",
        "packages/osmix/README.md",
        "scripts/check-docs.ts",
        "scripts/tsconfig.docs.json",
        "packages/osmix/src/**",
        "packages/change/src/**",
        "packages/core/src/**",
        "packages/gtfs/src/**",
        "packages/load/src/**",
        "packages/router/src/**",
        "packages/vt/src/**",
      ]
  "format:check":
    outputs: []
    inputs: ["+**/*.ts", "+**/*.tsx", "+**/package.json", ".oxfmtrc.json"]
  "lint:check":
    outputs: []
    inputs: ["+**/*.ts", "+**/*.tsx", ".oxlintrc.json"]
  test:
    dependsOn: ["^test"]
    outputs: []
    inputs: ["src/**", "test/**", "tsconfig*.json", "vitest.config.ts"]
    env: ["VITEST_INCLUDE_APPS"]
  "test:check-docs":
    outputs: []
    inputs: ["scripts/check-docs.ts", "scripts/check-docs.test.ts"]
  typecheck:
    dependsOn: ["^typecheck"]
    outputs: []
    inputs: ["src/**", "test/**", "tsconfig*.json"]

pipelines:
  all-root: ["lint:check", "check:deps", "format:check", "check:docs", "test:check-docs"]
  build: [build]
  deps: ["check:deps"]
  docs: ["check:docs", "test:check-docs"]
  format: ["format:check"]
  typecheck: [typecheck]
  test: [test]
  lint: ["lint:check"]
  verify: [build, typecheck, test]

overrides:
  apache-arrow: ^18.1.0

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true

catalog:
  "@base-ui/react": ^1.8.0
  "@placemarkio/geojson-rewind": ^1.0.3
  "@types/geojson": ^7946.0.16
  "@types/node": ^24.13.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  comlink: ^4.4.2
  dequal: ^2.0.3
  jotai: ^3.0.0
  jotai-family: ^1.1.0
  lucide-react: ^1.46.0
  maplibre-gl: ^6.10.0
  pbf: ^5.1.2
  react: ^19.3.0
  react-dom: ^19.3.0
  react-map-gl: ^8.1.3
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: ^8.3.0
