name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v3
      - uses: oven-sh/setup-bun@v2

      - name: Format, lint and type check
        run: pnpm exec oxfmt --check . && pnpm exec oxlint -f github

      - name: Check unused files, exports and dependencies (knip)
        run: pnpm run knip

      - name: Build packages
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

  e2e:
    name: App browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v3

      - name: Install Chromium
        run: pnpm --filter @osmix/app exec playwright install --with-deps chromium

      - name: Run app browser tests
        run: pnpm --filter @osmix/app test:e2e

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            apps/app/test-results/
          if-no-files-found: ignore
          retention-days: 7

  cli-executable:
    name: CLI standalone executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: bun

      - name: Build and test the standalone executable
        run: pnpm --filter @osmix/cli run test:executable

  runtime-node:
    name: Runtime smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}

      - name: Capture consumer Node.js
        run: echo "OSMIX_NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"

      - name: Run runtime smoke test
        run: pnpm run smoke

  runtime-bun:
    name: Runtime smoke (Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: bun

      - name: Run runtime smoke test
        run: pnpm run smoke -- bun
