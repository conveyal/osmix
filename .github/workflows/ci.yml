name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
      - uses: oven-sh/setup-bun@v2

      - uses: ./.github/actions/checks

  cli-executable:
    name: CLI standalone executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: bun

      - name: Build and test the standalone executable
        run: pnpm --filter @osmix/cli run test:executable

  runtime-node:
    name: Runtime smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}

      - name: Capture consumer Node.js
        run: echo "OSMIX_NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"

      - name: Run runtime smoke test
        run: pnpm run test:node-smoke

  runtime-bun:
    name: Runtime smoke (Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: bun

      - name: Run runtime smoke test
        run: pnpm run test:node-smoke -- bun

  runtime-deno:
    name: Runtime smoke (Deno)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: deno

      - name: Run runtime smoke test
        run: pnpm run test:node-smoke -- deno
