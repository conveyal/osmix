name: CI Checks
description: Run checks and tests

runs:
  using: composite
  steps:
    - name: Type check
      shell: bash
      run: pnpm run typecheck

    - name: Check unused files, exports, and dependencies (knip)
      shell: bash
      run: pnpm run knip

    - name: Build packages
      shell: bash
      run: pnpm run build

    - name: Lint (oxlint)
      shell: bash
      run: pnpm exec oxlint --type-aware -f github

    - name: Format check (oxfmt)
      shell: bash
      run: pnpm exec oxfmt . --check

    - name: Run package tests
      shell: bash
      run: pnpm run test:packages

    - name: Install Chromium
      shell: bash
      run: pnpm --filter @osmix/app exec playwright install --with-deps chromium

    - name: Run app browser tests
      shell: bash
      run: pnpm --filter @osmix/app test:e2e

    - name: Upload browser failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: browser-test-results
        path: |
          apps/app/test-results/
        if-no-files-found: ignore
        retention-days: 7
